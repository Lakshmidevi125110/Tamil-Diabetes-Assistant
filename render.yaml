services:
  - type: web
    name: tamil-diabetes-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      # Set to the Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Neon PostgreSQL connection string (reserved for upcoming persistence)
      - key: DATABASE_URL
        sync: false
