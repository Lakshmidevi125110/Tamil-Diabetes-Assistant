services:
  - type: web
    name: tamil-diabetes-assistant
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: DEBUG
        value: "False"
      - key: FLASK_DEBUG
        value: "0"
      - key: PYTHON_VERSION
        value: 3.11.9
